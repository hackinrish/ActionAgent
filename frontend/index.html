<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Debrief Agent</title>
  <style>
    /* ── Reset & base ───────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f172a;
      --surface:    #1e293b;
      --surface2:   #273549;
      --border:     #334155;
      --text:       #f1f5f9;
      --muted:      #94a3b8;
      --accent:     #10b981;
      --accent-dim: #064e3b;
      --blue:       #3b82f6;
      --blue-dim:   #1e3a5f;
      --warn:       #f59e0b;
      --warn-dim:   #451a03;
      --danger:     #ef4444;
      --radius:     10px;
      --shadow:     0 4px 24px rgba(0,0,0,.4);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Layout ─────────────────────────────────────────────────────────────── */
    .page { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }

    header {
      display: flex; align-items: center; gap: 12px;
      padding: 28px 0 32px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }
    .logo { font-size: 28px; }
    header h1 { font-size: 22px; font-weight: 700; }
    header p  { color: var(--muted); font-size: 13px; margin-top: 2px; }

    /* ── Card ────────────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 13px; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Form ────────────────────────────────────────────────────────────────── */
    .field { margin-bottom: 16px; }
    label  { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--muted); }

    textarea, input[type="text"] {
      width: 100%; padding: 10px 14px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 7px; color: var(--text);
      font-family: inherit; font-size: 14px;
      resize: vertical; outline: none;
      transition: border-color .15s;
    }
    textarea { min-height: 220px; }
    textarea:focus, input[type="text"]:focus { border-color: var(--blue); }

    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }

    button {
      padding: 10px 22px; border: none; border-radius: 7px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    button:hover:not(:disabled) { opacity: .88; }
    button:active:not(:disabled) { transform: scale(.97); }
    button:disabled { opacity: .4; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost   { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

    /* ── Pipeline progress ───────────────────────────────────────────────────── */
    .pipeline {
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
      margin-bottom: 8px;
    }
    .step {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 500;
      background: var(--surface2); color: var(--muted);
      border: 1px solid var(--border);
      transition: all .3s;
    }
    .step.active  { background: var(--blue-dim);  color: var(--blue);   border-color: var(--blue); }
    .step.done    { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
    .step .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .step.active .dot { animation: pulse 1s infinite; }
    .step-arrow { color: var(--border); font-size: 11px; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }

    /* ── Spinner ─────────────────────────────────────────────────────────────── */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Summary card ────────────────────────────────────────────────────────── */
    .summary-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .tag {
      padding: 3px 10px; border-radius: 20px; font-size: 12px;
      background: var(--surface2); color: var(--muted);
      border: 1px solid var(--border);
    }
    .summary-text { margin-top: 12px; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .decisions    { margin-top: 12px; }
    .decision-item {
      padding: 7px 12px; margin-bottom: 6px; border-radius: 6px;
      background: var(--surface2); border-left: 3px solid var(--accent);
      font-size: 13px; color: var(--muted);
    }

    /* ── Action items table ──────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 9px 12px;
      color: var(--muted); font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    }
    .badge-ok     { background: var(--accent-dim); color: var(--accent); }
    .badge-warn   { background: var(--warn-dim);   color: var(--warn); }
    .badge-high   { background: #3b1919; color: #f87171; }
    .badge-medium { background: #1c2a3b; color: #60a5fa; }
    .badge-low    { background: var(--surface2); color: var(--muted); }

    .item-id { font-family: monospace; font-size: 12px; color: var(--muted); }
    .item-desc { font-weight: 500; }
    .item-context { font-size: 11px; color: var(--muted); margin-top: 3px; font-style: italic; }

    /* ── Dispatch cards ──────────────────────────────────────────────────────── */
    .dispatch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 640px) { .dispatch-grid { grid-template-columns: 1fr; } }

    .dispatch-card {
      border-radius: var(--radius); padding: 16px;
      border: 1px solid var(--border); background: var(--surface2);
    }
    .dispatch-card.success { border-color: var(--accent); }
    .dispatch-card.failure { border-color: var(--danger); }

    .dispatch-icon   { font-size: 22px; margin-bottom: 8px; }
    .dispatch-name   { font-weight: 700; font-size: 15px; }
    .dispatch-count  { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .dispatch-status { margin-top: 8px; }

    /* ── Utility ─────────────────────────────────────────────────────────────── */
    .hidden   { display: none !important; }
    .section-title {
      font-size: 16px; font-weight: 700; margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .count-badge {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 1px 8px;
      font-size: 12px; color: var(--muted); font-weight: 500;
    }
    .error-box {
      background: #2d1515; border: 1px solid #7f1d1d;
      border-radius: var(--radius); padding: 14px 16px;
      color: #fca5a5; font-size: 13px;
    }
  </style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo">⚡</div>
    <div>
      <h1>Meeting Debrief Agent</h1>
      <p>Turn meeting transcripts into structured, dispatched action items</p>
    </div>
  </header>

  <!-- ── Input form ────────────────────────────────────────────────────────── -->
  <div class="card" id="input-card">
    <div class="card-title">New Debrief</div>

    <div class="field">
      <label for="transcript">Meeting Transcript</label>
      <textarea id="transcript" placeholder="Paste your Zoom / Google Meet transcript here…"></textarea>
    </div>

    <div class="field">
      <label for="team">Team Members <span style="font-weight:400">(comma-separated)</span></label>
      <input type="text" id="team"
             placeholder="Alice Smith, Bob Jones, Carol White, David Lee" />
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="submit-btn" onclick="runDebrief()">
        ⚡ Process Meeting
      </button>
      <button class="btn-ghost" onclick="loadSample()">Load Sample</button>
    </div>
  </div>

  <!-- ── Error ──────────────────────────────────────────────────────────────── -->
  <div class="error-box hidden" id="error-box"></div>

  <!-- ── Pipeline progress ─────────────────────────────────────────────────── -->
  <div class="card hidden" id="progress-card">
    <div class="card-title" id="progress-title">
      <span class="spinner" style="margin-right:8px"></span>
      Running pipeline…
    </div>
    <div class="pipeline" id="pipeline-steps"></div>
  </div>

  <!-- ── Summary ────────────────────────────────────────────────────────────── -->
  <div class="card hidden" id="summary-card">
    <div class="section-title">📋 Meeting Summary</div>
    <div id="summary-content"></div>
  </div>

  <!-- ── Action items ───────────────────────────────────────────────────────── -->
  <div class="card hidden" id="items-card">
    <div class="section-title">
      ✅ Action Items
      <span class="count-badge" id="items-count">0</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Description</th>
            <th>Owner</th>
            <th>Deadline</th>
            <th>Priority</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="items-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- ── Dispatch results ───────────────────────────────────────────────────── -->
  <div class="card hidden" id="dispatch-card">
    <div class="section-title">🚀 Dispatched To</div>
    <div class="dispatch-grid" id="dispatch-grid"></div>
  </div>

</div><!-- /page -->

<script>
/* ── Pipeline node metadata ─────────────────────────────────────────────── */
const NODE_META = {
  summarize:          { label: 'Summarize',   icon: '📋' },
  extract_actions:    { label: 'Extract',     icon: '🔍' },
  assign_owners:      { label: 'Assign',      icon: '👤' },
  validate:           { label: 'Validate',    icon: '✔️'  },
  dispatch_notion:    { label: 'Notion',      icon: '📝' },
  dispatch_jira:      { label: 'Jira',        icon: '🎯' },
  dispatch_slack:     { label: 'Slack',       icon: '💬' },
  aggregate_dispatch: { label: 'Aggregate',   icon: '🔗' },
};

const PIPELINE_ORDER = [
  'summarize', 'extract_actions', 'assign_owners', 'validate',
  'dispatch_notion', 'dispatch_jira', 'dispatch_slack', 'aggregate_dispatch',
];

/* ── State ──────────────────────────────────────────────────────────────── */
let activeNode = null;

/* ── Helpers ─────────────────────────────────────────────────────────────── */
function $(id) { return document.getElementById(id); }
function show(id) { $(id).classList.remove('hidden'); }
function hide(id) { $(id).classList.add('hidden'); }
function esc(s)  { return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── Build pipeline steps ─────────────────────────────────────────────────── */
function buildPipelineSteps() {
  const container = $('pipeline-steps');
  container.innerHTML = '';
  PIPELINE_ORDER.forEach((node, i) => {
    const meta = NODE_META[node] || { label: node, icon: '◦' };
    const step = document.createElement('div');
    step.className = 'step';
    step.id = `step-${node}`;
    step.innerHTML = `<span class="dot"></span>${meta.icon} ${meta.label}`;
    container.appendChild(step);
    if (i < PIPELINE_ORDER.length - 1) {
      const arrow = document.createElement('span');
      arrow.className = 'step-arrow';
      arrow.textContent = '›';
      container.appendChild(arrow);
    }
  });
}

function markNodeActive(node) {
  if (activeNode) {
    const prev = $(`step-${activeNode}`);
    if (prev) { prev.classList.remove('active'); prev.classList.add('done'); }
  }
  const el = $(`step-${node}`);
  if (el) el.classList.add('active');
  activeNode = node;
}

function markNodeDone(node) {
  const el = $(`step-${node}`);
  if (el) { el.classList.remove('active'); el.classList.add('done'); }
  activeNode = null;
}

/* ── Render results ──────────────────────────────────────────────────────── */
function renderSummary(summary) {
  if (!summary) return;
  const el = $('summary-content');
  const participants = (summary.participants || []).map(p => `<span class="tag">${esc(p)}</span>`).join('');
  const decisions    = (summary.key_decisions || [])
    .map(d => `<div class="decision-item">${esc(d)}</div>`).join('');
  el.innerHTML = `
    <strong style="font-size:16px">${esc(summary.title)}</strong>
    <div class="summary-meta">${participants}</div>
    <div class="summary-text">${esc(summary.summary)}</div>
    ${decisions ? `<div class="decisions"><div class="card-title" style="margin-top:12px">Key Decisions</div>${decisions}</div>` : ''}
  `;
  show('summary-card');
}

function renderItems(items) {
  if (!items || !items.length) return;
  $('items-count').textContent = items.length;
  const tbody = $('items-tbody');
  tbody.innerHTML = items.map(item => {
    const priClass = { high: 'badge-high', medium: 'badge-medium', low: 'badge-low' }[item.priority] || 'badge-medium';
    const status = item.needs_clarification
      ? `<span class="badge badge-warn">⚠ Needs Clarification</span>`
      : `<span class="badge badge-ok">✓ OK</span>`;
    const context = item.context
      ? `<div class="item-context">"${esc(item.context.slice(0, 120))}${item.context.length > 120 ? '…' : ''}"</div>`
      : '';
    return `
      <tr>
        <td><span class="item-id">${esc(item.id)}</span></td>
        <td><div class="item-desc">${esc(item.description)}</div>${context}</td>
        <td>${item.owner ? esc(item.owner) : '<span style="color:var(--muted)">—</span>'}</td>
        <td>${item.deadline ? esc(item.deadline) : '<span style="color:var(--muted)">—</span>'}</td>
        <td><span class="badge ${priClass}">${esc(item.priority)}</span></td>
        <td>${status}</td>
      </tr>`;
  }).join('');
  show('items-card');
}

function renderDispatch(results) {
  if (!results || !results.length) return;
  const byTool = {};
  results.forEach(r => {
    if (!byTool[r.tool]) byTool[r.tool] = [];
    byTool[r.tool].push(r);
  });

  const TOOL_META = {
    notion: { icon: '📝', name: 'Notion',  label: 'pages created' },
    jira:   { icon: '🎯', name: 'Jira',    label: 'issues created' },
    slack:  { icon: '💬', name: 'Slack',   label: 'message sent' },
  };

  const grid = $('dispatch-grid');
  grid.innerHTML = ['notion', 'jira', 'slack'].map(tool => {
    const meta    = TOOL_META[tool] || { icon: '📦', name: tool, label: 'items' };
    const items   = byTool[tool] || [];
    const success = items.every(r => r.success);
    const ids     = items.filter(r => r.item_id).map(r => `<code style="font-size:11px;color:var(--muted)">${esc(r.item_id)}</code>`).join('<br>');
    return `
      <div class="dispatch-card ${success ? 'success' : 'failure'}">
        <div class="dispatch-icon">${meta.icon}</div>
        <div class="dispatch-name">${meta.name}</div>
        <div class="dispatch-count">${items.length} ${meta.label}</div>
        <div class="dispatch-status">
          ${success
            ? `<span class="badge badge-ok">✓ Success</span>`
            : `<span class="badge badge-warn">⚠ Partial</span>`}
        </div>
        ${ids ? `<div style="margin-top:8px">${ids}</div>` : ''}
      </div>`;
  }).join('');
  show('dispatch-card');
}

/* ── Main run function ───────────────────────────────────────────────────── */
async function runDebrief() {
  const transcript = $('transcript').value.trim();
  const team       = $('team').value.trim();

  if (!transcript) { alert('Please paste a meeting transcript.'); return; }

  // Reset UI
  hide('error-box');
  hide('summary-card');
  hide('items-card');
  hide('dispatch-card');
  activeNode = null;
  buildPipelineSteps();
  show('progress-card');
  $('progress-title').innerHTML = '<span class="spinner" style="margin-right:8px;vertical-align:middle"></span> Running pipeline…';

  const btn = $('submit-btn');
  btn.disabled = true;

  const teamMembers = team ? team.split(',').map(s => s.trim()).filter(Boolean) : [];

  try {
    // 1. Create job
    const jobResp = await fetch('/debrief/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript, team_members: teamMembers }),
    });
    if (!jobResp.ok) throw new Error(`Failed to create job: ${jobResp.status}`);
    const { job_id } = await jobResp.json();

    // 2. Open SSE stream
    await new Promise((resolve, reject) => {
      const es = new EventSource(`/debrief/jobs/${job_id}/stream`);

      es.addEventListener('progress', e => {
        const { node } = JSON.parse(e.data);
        markNodeActive(node);
      });

      es.addEventListener('complete', e => {
        es.close();
        const data = JSON.parse(e.data);
        // Mark last active node as done
        PIPELINE_ORDER.forEach(n => markNodeDone(n));
        $('progress-title').textContent = '✓ Pipeline complete';
        renderSummary(data.summary);
        renderItems(data.action_items);
        renderDispatch(data.dispatch_results);
        resolve();
      });

      es.onerror = err => {
        es.close();
        reject(new Error('Stream connection error'));
      };
    });

  } catch (err) {
    $('error-box').textContent = `Error: ${err.message}`;
    show('error-box');
    hide('progress-card');
  } finally {
    btn.disabled = false;
  }
}

/* ── Load sample transcript ─────────────────────────────────────────────── */
function loadSample() {
  $('transcript').value = `Meeting: Q2 Sprint Planning
Date: 2026-04-30
Participants: Alice Smith, Bob Jones, Carol White, David Lee

Alice Smith: Alright everyone, let's get started. We have a lot to cover today for Q2 planning.

Bob Jones: Should we start with the backlog review?

Alice Smith: Yes. Carol, can you walk us through the priority items?

Carol White: The top priority is finishing the authentication refactor — we decided to move to OAuth2. I'll need Bob to complete the backend token validation by May 15th.

Bob Jones: Got it, I'll have token validation done by May 15th.

Alice Smith: David, what's the status on the mobile app performance issues?

David Lee: Found the bottleneck — it's in the image loading pipeline. I'll fix the image caching layer and have a PR up by May 10th.

Alice Smith: We also need to update the API documentation before the partner demo on May 20th. Carol, can you own that?

Carol White: Yes, I'll have a draft ready by May 17th.

Bob Jones: We also need to set up the staging environment for QA. Nobody has picked that up.

Alice Smith: David, can you take that on by May 12th?

David Lee: Sure, staging environment by May 12th.

Bob Jones: I can also scope out the Grafana metrics migration and have a plan by May 8th.

Alice Smith: Decisions today: OAuth2 for auth, Grafana for metrics, partner demo May 20th. Let's plan a check-in on May 18th at 2pm — I'll send the invite.`;

  $('team').value = 'Alice Smith, Bob Jones, Carol White, David Lee';
}

/* ── Enter key in team field ────────────────────────────────────────────── */
$('team').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); runDebrief(); }
});

/* ── Keyboard shortcut: Cmd/Ctrl + Enter in textarea ───────────────────── */
$('transcript').addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); runDebrief(); }
});
</script>
</body>
</html>
